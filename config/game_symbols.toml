# Road Trip (USA, SLUS-20398): our names for the game's routines and data.
#
# Addresses, names and one-line notes only: never game code. scripts/ghidra/decompile.py applies
# them to the Ghidra project on every run (they win over roadtrip.toml and game_state.toml names).
# Key = address; value = { name, note } (note optional). Rendering layer: docs/native-render.md.
# Notes say "likely" or "guess" where not verified.

[functions]
