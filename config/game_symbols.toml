# --- Textures, GS memory and 2D packets (docs/native-textures.md) ---
0x2003B8 = { name = "gameMainLoop", note = "boot + per-frame loop: clears GS 0..0x1A40, loads the font, walks tasks, post-pass, sceGsSwapDBuffDc" }
