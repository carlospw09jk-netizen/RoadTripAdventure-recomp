0x20AEF0 = { name = "loadCarPartsSet", note = "SYS entries 1..4: EFFECT.GSL (absolute 16169..), CARS/PARTS (TBP + 0x1BC2), TIRE (+ 0x1C44), WHEEL (models only)" }
0x20B348 = { name = "loadPoseSet", note = "SYS entry 9 (POSE.GSL) at TBP + 0x1D8E; model blob to 0x3FA780 (likely)" }
0x20B5E8 = { name = "loadShopSet", note = "SHOP/Tnn (table 0x29B29C) and SYS entry 11; rebases 0x1F2E, 0x1CC6, 0x285E, 0x34BE (shop interiors: T8 640x384)" }
0x20C188 = { name = "loadCourseTile", note = "COURSE/ACTION file (table 0x29BE50), like loadFieldTile; each misc model's chain rebased to TBP 0x2B26 + i * 0x44" }
0x20AD18 = { name = "copyCarModel", note = "car slot a -> b: memmove of the model blob and a GS local-to-local copy (T8 128x128 + 16x16 CLUT) through the template 0x29AD90" }
0x20E1F0 = { name = "cdReadEntry", note = "starts sceCdRead of a {mode, lsn, sectors} table entry to dest (async; 0x20E440 polls)" }
0x20E250 = { name = "cdReadEntryPart", note = "as cdReadEntry for a byte range of the entry (offset, size)" }
0x20E318 = { name = "cdReadEntryWait", note = "cdReadEntry that waits (sceGsSyncV loop) until the read is done" }
0x20E440 = { name = "cdReadPoll", note = "polls the pending sceCdRead; 0 when done" }
0x20DCD8 = { name = "debugScreenRead", note = "sceGsExecStoreImage of a whole frame buffer (debug 'Screen Save'; no live callers)" }
0x20E500 = { name = "debugScreenSave", note = "writes the capture to a file (debug; no callers)" }
0x208120 = { name = "postPassSprite", note = "DIRECT packet (0x29A930 + variant * 0x90): the frame buffer (measured: the one being drawn) as a CT24 1024x256 texture over itself, FIX 0x20 (0..639 x 0..223) or 0x40 (loading blur, 2,1..637,222)" }
0x203810 = { name = "draw2dListBegin", note = "per-frame 2D packet accumulator: flushes the last one (DIRECT) and starts the next in one of two buffers at 0x3362E0 / 0x340350 (stride 0xA070) (count at 0x335684, cap 0xA00)" }
0x203990 = { name = "draw2dPushTexa", note = "appends a TEXA write (ta0 = arg, aem 1, ta1 = ta0 / 2) to the 2D accumulator (CT16 fades)" }
0x2038F8 = { name = "draw2dInitPackets", note = "the two 2D accumulators' headers: TEX0 TBP 0x1A40 T8 512x512 CBP 0x1BC0 (the font), CLAMP" }
0x21D718 = { name = "gifSpritePacketInit", note = "A+D header of a 2D draw: TEST, ALPHA, TEX1, TEX0 (arg), CLAMP; a sprite region follows" }
0x21DAE8 = { name = "gifSpritePacketCount", note = "sets the packet's GIF NLOOP to 5 * n (n sprites)" }
0x2063C8 = { name = "gifSpriteRegion", note = "(buf, x, y, u, v, w, h): a sprite cutting region (u, v, w, h) from the TEX0 at screen (x, y); writes REGION_CLAMP (CLAMP 2/2) for the region" }
0x23E140 = { name = "texAnimCopyA", note = "per-frame GS local-to-local copies (template 0x2A3490, 3 copies: scrolling T4 windows); first of 26 sites, see docs/native-textures.md" }
0x262678 = { name = "texAnimCopyB", note = "same with the template 0x2D9F50 (3 copies: NLOOP 0xC)" }

